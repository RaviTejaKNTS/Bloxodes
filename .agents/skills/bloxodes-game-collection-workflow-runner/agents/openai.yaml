interface:
  display_name: "Bloxodes Game Collection Runner"
  short_description: "Run collection research, data, images, subagent writing, and verification"
  default_prompt: "Use /bloxodes-game-collection-workflow-runner for approved game collections. Give one collection to each collection subagent for research, data, and images, with parent approval at each gate. After image approval, spawn a separate writing subagent with bloxodes-game-collection-writing for final.json. Parent-review description, natural highlight, chip/detail values, consistent fields, images, useful wiki_md, no prose counts, and valid faq_json q/a keys. Run verify:game-collection-finals, preview localhost links, and return results."
