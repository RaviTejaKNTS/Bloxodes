interface:
  display_name: "Bloxodes Game Collection Runner"
  short_description: "Run collection research, data, images, Claude writing, and verification"
  default_prompt: "Use /bloxodes-game-collection-workflow-runner for approved Bloxodes game collections. Give one collection to each subagent, queue extras, and tell subagents not to run the workflow runner or create more subagents. Use /bloxodes-game-collection-research, /bloxodes-game-collection-data, and /bloxodes-game-collection-images as the Codex subagent gates. After image approval, do not ask the Codex subagent to write final.json; run npm run write:game-collection:claude -- --game <game-slug> --collection <collection-slug>, then use --run when the Claude CLI is available or paste the generated prompt into Claude manually. Require Claude to write final.json and do one human-friendly self-review pass. Parent-review the new collection shape, including description, natural highlight, chip/detail values, consistent fields, images/placeholders, no label-stuffed item values, useful wiki_md, no prose counts, and valid faq_json q/a keys. Run verify:game-collection-finals, open passed localhost links in the Codex Browser, and return links."
