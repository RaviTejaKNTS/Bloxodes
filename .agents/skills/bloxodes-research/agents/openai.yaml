interface:
  display_name: "Bloxodes Research"
  short_description: "Research Roblox facts for Bloxodes content"
  default_prompt: "Use $bloxodes-research to prepare plain-language research-notes.md for one Bloxodes page. First check production DB or public production URLs for existing coverage across relevant page families and reject duplicate topics before suggesting new work. Explain the topic before database or route notes. For catalog pages, include the player-usefulness gate, required fact matrix, competitor/source coverage when SEO matters, local/source/rendered counts, image coverage, missing data, missing useful facts, and the data action before proposing sections. The outline must also name the reader story flow, the how-to/action section the final page needs when the topic has action, what belongs in description_json, and what must stay in description_md."
