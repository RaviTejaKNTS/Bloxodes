interface:
  display_name: "Bloxodes Game Catalog Writing"
  short_description: "Write game dataset catalog copy"
  default_prompt: "Use $bloxodes-game-catalog-writing for one game-specific catalog page. Read the required docs, create plain-language research-notes.md first, include the required data/image audit, propose any dataset or image updates plus the section/card structure, wait for approval, then update local data if needed. Write a first-pass final.json, run $bloxodes-flow-edit so description_md becomes a whole-page player explanation with a useful how-to/action section when the collection has action, then run $bloxodes-final-edit before saving final.json with wiki_md for the wiki hub."
