interface:
  display_name: "Bloxodes Article Workflow Runner"
  short_description: "Run article brief and QA workflow"
  default_prompt: "Use $bloxodes-article-workflow-runner to run one or more approved Bloxodes article ideas. Give one article to each subagent, queue extras when slots are full, and do not write from the parent role. Have the same subagent research with $bloxodes-article-research, wait for brief approval, then write final.json with $bloxodes-article-writing. Start localhost with .env.local loaded, run verify:article-finals as the feedback gate, open passed /articles/<slug> links in the Codex Browser, and return localhost links."
