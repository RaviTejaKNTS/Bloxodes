interface:
  display_name: "Bloxodes Article Workflow Runner"
  short_description: "Run article research, Claude writing, and QA workflow"
  default_prompt: "Use /bloxodes-article-workflow-runner to run one or more approved Bloxodes article ideas. Give one article to each subagent, queue extras when slots are full, and do not write from the parent role. Tell subagents not to run the workflow runner or create more subagents. Have the Codex subagent research with /bloxodes-article-research and wait for brief approval. After approval, do not ask the Codex subagent to write final.json; run npm run write:article:claude -- --topic <game-or-topic-slug> --article <article-slug>, add --tech for Roblox platform/troubleshooting articles, then use --run when the Claude CLI is available or paste the generated prompt into Claude manually. Require Claude to write final.json and do one human-friendly self-review pass. Start localhost with npm run dev:local, run verify:article-finals as the feedback gate, send writing/JSON/copy failures to Claude and research/accuracy gaps to the research subagent, open passed /articles/<slug> links in the Codex Browser, and return localhost links."
