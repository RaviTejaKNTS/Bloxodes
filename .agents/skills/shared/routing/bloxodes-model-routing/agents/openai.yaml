interface:
  display_name: "Bloxodes Model Routing"
  short_description: "Split T3 Code runs between the researcher and the writer"
  default_prompt: "Use $bloxodes-model-routing when you orchestrate a Bloxodes runner in T3 Code. Hand each stage to a fresh child on its assigned role: the researcher for research, data, images and editorial review, the writer for reviews of the researcher's work, writing and the one revision. Review every handoff and stop at approved finals."
