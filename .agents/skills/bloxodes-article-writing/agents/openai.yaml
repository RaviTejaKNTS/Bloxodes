interface:
  display_name: "Bloxodes Article Writing"
  short_description: "Write Bloxodes articles"
  default_prompt: "Use $bloxodes-article-writing to write one Bloxodes article final.json from an approved brief.md. Collect required catalog, collection, and item images from approved sources, host them in Supabase Storage without adding repo assets, include game name in title/slug for game articles, avoid self-referential wording, then parse-check final.json."
