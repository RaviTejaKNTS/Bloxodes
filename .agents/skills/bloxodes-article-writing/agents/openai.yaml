interface:
  display_name: "Bloxodes Article Writing"
  short_description: "Write Bloxodes articles"
  default_prompt: "Use $bloxodes-article-writing as a writing subagent to write one article final.json from an approved brief.md. Read top to bottom like a calm gaming guide: full sentences, simple words, clean story flow, real player moments, no hype and no research voice. Include the game name in title/slug for game pieces, match FAQ voice to body, self-review once for flow, then parse-check final.json."
