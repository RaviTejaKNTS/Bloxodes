interface:
  display_name: "Bloxodes Checklist Runner"
  short_description: "Run 100% checklist research, writing and QA"
  default_prompt: "Use $bloxodes-checklist-workflow-runner for the game's single standalone 100% completion checklist or explicit user exception. Reuse existing coverage. Have one subagent research with $bloxodes-checklist-research, wait for parent approval, then write with $bloxodes-checklist-writing. Do not let it spawn other agents. Use Managed content QA for the exact reviewed final and require its complete-row comparison, desktop/mobile progress tests and hash-bound receipt before publication."
