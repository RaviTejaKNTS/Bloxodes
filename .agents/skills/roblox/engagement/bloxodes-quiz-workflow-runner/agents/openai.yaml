interface:
  display_name: "Bloxodes Quiz Runner"
  short_description: "Run quiz research/write QA"
  default_prompt: "Use /bloxodes-quiz-workflow-runner for one approved Bloxodes quiz. Tell the subagent not to run the workflow runner or create more subagents. Have one subagent research with /bloxodes-quiz-research, wait for approval, write final.json with /bloxodes-quiz-writing, stage the reviewed final in a selected batch, run Managed content QA on GitHub, and return the GitHub artifact links."
