interface:
  display_name: "Bloxodes Tier List Writing"
  short_description: "Write image-backed Bloxodes tier-list articles"
  default_prompt: "Use $bloxodes-tier-list-writing to write one source-backed Bloxodes tier-list article from an approved brief and its media.json, including the visual overview block and matching per-tier detail tables when exact images are verified, with text fallback only for accepted-missing targets. Follow $bloxodes-voice: answer first, sound like a player who knows the game, clean and a little fun, no templates or research language."