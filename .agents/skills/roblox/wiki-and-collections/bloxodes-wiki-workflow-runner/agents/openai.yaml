interface:
  display_name: "Bloxodes Wiki Runner"
  short_description: "Run wiki research/write QA"
  default_prompt: "Use /bloxodes-wiki-workflow-runner for one approved Bloxodes wiki hub. Tell the subagent not to run the workflow runner or create more subagents. Have one subagent research with /bloxodes-wiki-research, wait for approval, write final.json with /bloxodes-wiki-writing, run verify:wiki-final, open the localhost wiki link in Codex Browser, and return the link."
