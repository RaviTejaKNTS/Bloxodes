services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - application_env
        - content_env
        - distribution_env
        - production_target_env
    image: bloxodes-web:local
    restart: unless-stopped
    init: true
    env_file:
      - .envs/shared/application.env
      - .envs/integrations/content.env
      - .envs/integrations/distribution.env
      - .envs/targets/production.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - next-cache:/app/apps/web/.next/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((res)=>{if(!res.ok)process.exit(1);}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s

volumes:
  next-cache:

secrets:
  application_env:
    file: .envs/shared/application.env
  content_env:
    file: .envs/integrations/content.env
  distribution_env:
    file: .envs/integrations/distribution.env
  production_target_env:
    file: .envs/targets/production.env
