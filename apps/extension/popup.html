<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bloxodes widgets</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <img src="brand/Bloxodes-dark.png" alt="Bloxodes" />
        <p>Roblox game companion</p>
      </header>

      <section class="account-card" aria-label="Bloxodes account">
        <div id="auth-loading" class="account-loading">Checking account…</div>

        <div id="signed-out" hidden>
          <div class="account-copy">
            <strong>Sync used codes</strong>
            <small>Sign in to keep copied and checked codes in sync across devices.</small>
          </div>
          <button id="sign-in" class="primary-button" type="button">Sign in with Roblox</button>
        </div>

        <div id="signed-in" hidden>
          <div class="account-profile">
            <img id="account-avatar" alt="" hidden />
            <span id="account-avatar-fallback" aria-hidden="true">B</span>
            <span class="account-copy">
              <small>Signed in</small>
              <strong id="account-name">Bloxodes user</strong>
              <small id="account-username"></small>
            </span>
          </div>
          <button id="sign-out" class="secondary-button" type="button">Sign out</button>
        </div>

        <p id="auth-status" class="auth-status" aria-live="polite"></p>
      </section>

      <section class="widget-list" aria-label="Bloxodes widget settings">
        <label class="widget-setting" for="show-codes">
          <span>
            <strong>Active codes</strong>
            <small>Show verified codes on supported games.</small>
          </span>
          <span class="toggle">
            <input id="show-codes" type="checkbox" />
            <span aria-hidden="true"></span>
          </span>
        </label>

        <label class="widget-setting" for="show-history">
          <span>
            <strong>Player history</strong>
            <small>Show the seven-day player-count graph.</small>
          </span>
          <span class="toggle">
            <input id="show-history" type="checkbox" />
            <span aria-hidden="true"></span>
          </span>
        </label>
      </section>

      <p id="save-status" class="save-status" aria-live="polite">Changes apply immediately.</p>
      <nav class="legal-links" aria-label="Bloxodes policies">
        <a href="https://bloxodes.com/privacy-policy" target="_blank" rel="noreferrer">Privacy</a>
        <span aria-hidden="true">·</span>
        <a href="https://bloxodes.com/terms-of-service" target="_blank" rel="noreferrer">Terms</a>
        <span aria-hidden="true">·</span>
        <a href="https://bloxodes.com/account-deletion" target="_blank" rel="noreferrer">Delete account</a>
      </nav>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
