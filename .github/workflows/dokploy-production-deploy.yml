name: Dokploy Production Deploy

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      trigger_dokploy:
        description: "Build/publish an image and deploy it through Dokploy before purge/warm"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      image_sha:
        description: "Existing GHCR commit SHA to deploy without rebuilding (leave blank for current SHA)"
        required: false
        default: ""
        type: string
      site_url:
        description: "Production site URL to health-check and warm"
        required: true
        default: "https://bloxodes.com"
        type: string
      purge_cloudflare:
        description: "Purge Cloudflare after deploy"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      warm_cloudflare:
        description: "Warm Cloudflare from the sitemap after purge"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: dokploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCTION_SITE_URL: ${{ inputs.site_url || vars.PRODUCTION_SITE_URL || 'https://bloxodes.com' }}
      IMAGE_NAME: ghcr.io/ravitejaknts/bloxodes-web
      DEPLOY_IMAGE_SHA: ${{ inputs.image_sha || github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install quality dependencies
        run: npm ci --ignore-scripts

      - name: Install candidate browser
        run: npx playwright install --with-deps chromium

      - name: Validate production build environment
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.trigger_dokploy == 'true' && inputs.image_sha == '') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE SUPABASE_ANON_KEY NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production build setting: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Create production build environment file
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.trigger_dokploy == 'true' && inputs.image_sha == '') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
          NEXT_PUBLIC_UMAMI_HOST_URL: ${{ vars.NEXT_PUBLIC_UMAMI_HOST_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || vars.PRODUCTION_SITE_URL || 'https://bloxodes.com' }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          umask 077
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_SERVICE_ROLE=%s\n' "$SUPABASE_SERVICE_ROLE"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            printf 'NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=%s\n' "$NEXT_PUBLIC_GOOGLE_ANALYTICS_ID"
            printf 'NEXT_PUBLIC_UMAMI_HOST_URL=%s\n' "$NEXT_PUBLIC_UMAMI_HOST_URL"
            printf 'NEXT_PUBLIC_UMAMI_WEBSITE_ID=%s\n' "$NEXT_PUBLIC_UMAMI_WEBSITE_ID"
            printf 'NEXT_PUBLIC_SITE_URL=%s\n' "$NEXT_PUBLIC_SITE_URL"
            printf 'SITE_URL=%s\n' "${SITE_URL:-$NEXT_PUBLIC_SITE_URL}"
          } > "$RUNNER_TEMP/bloxodes-production-build.env"

      - name: Set up Docker Buildx
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.trigger_dokploy == 'true' && inputs.image_sha == '') }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.trigger_dokploy == 'true' && inputs.image_sha == '') }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate production image
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.trigger_dokploy == 'true' && inputs.image_sha == '') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            BLOXODES_BUILD_SHA=${{ github.sha }}
          secret-files: |
            production_env=${{ runner.temp }}/bloxodes-production-build.env
          cache-from: type=gha,scope=bloxodes-production-web
          cache-to: type=gha,mode=max,scope=bloxodes-production-web

      - name: Start candidate image
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.trigger_dokploy == 'true' && inputs.image_sha == '') }}
        run: |
          docker run --detach --rm \
            --name bloxodes-candidate \
            --env-file "$RUNNER_TEMP/bloxodes-production-build.env" \
            --publish 127.0.0.1:3100:3000 \
            "${IMAGE_NAME}:${GITHUB_SHA}"

          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then
              exit 0
            fi
            if ! docker inspect bloxodes-candidate >/dev/null 2>&1; then
              echo "Candidate container exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done
          echo "Candidate container did not become healthy"
          exit 1

      - name: Verify candidate image
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.trigger_dokploy == 'true' && inputs.image_sha == '') }}
        env:
          TEST_BASE_URL: http://127.0.0.1:3100
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || vars.PRODUCTION_SITE_URL || 'https://bloxodes.com' }}
        run: |
          npm run test:sitemaps
          npm run test:seo
          npm run test:routes
          npm run test:render

      - name: Stop candidate image
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.trigger_dokploy == 'true' && inputs.image_sha == '')) }}
        run: |
          docker logs bloxodes-candidate > "$RUNNER_TEMP/bloxodes-candidate.log" 2>&1 || true
          docker stop bloxodes-candidate || true

      - name: Publish verified production image
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.trigger_dokploy == 'true' && inputs.image_sha == '') }}
        run: |
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:production"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:production"

      - name: Upload candidate reports
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.trigger_dokploy == 'true' && inputs.image_sha == '')) }}
        uses: actions/upload-artifact@v7
        with:
          name: candidate-quality-reports-${{ github.sha }}
          path: |
            tmp/test-reports
            ${{ runner.temp }}/bloxodes-candidate.log
          if-no-files-found: ignore

      - name: Validate Dokploy configuration
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.trigger_dokploy == 'true' }}
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN || secrets.DOKPLOY_AUTH_TOKEN }}
          DOKPLOY_API_URL: ${{ vars.DOKPLOY_API_URL || secrets.DOKPLOY_API_URL || vars.DOKPLOY_URL || secrets.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID || secrets.DOKPLOY_APPLICATION_ID }}
          GHCR_DOKPLOY_USERNAME: ${{ vars.GHCR_DOKPLOY_USERNAME || github.repository_owner }}
          GHCR_DOKPLOY_TOKEN: ${{ secrets.GHCR_DOKPLOY_TOKEN }}
        run: |
          missing=0
          for name in DOKPLOY_API_TOKEN DOKPLOY_API_URL DOKPLOY_APPLICATION_ID GHCR_DOKPLOY_USERNAME GHCR_DOKPLOY_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required deployment setting: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Point Dokploy at the immutable production image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.trigger_dokploy == 'true' }}
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN || secrets.DOKPLOY_AUTH_TOKEN }}
          DOKPLOY_API_URL: ${{ vars.DOKPLOY_API_URL || secrets.DOKPLOY_API_URL || vars.DOKPLOY_URL || secrets.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID || secrets.DOKPLOY_APPLICATION_ID }}
          GHCR_DOKPLOY_USERNAME: ${{ vars.GHCR_DOKPLOY_USERNAME || github.repository_owner }}
          GHCR_DOKPLOY_TOKEN: ${{ secrets.GHCR_DOKPLOY_TOKEN }}
        run: |
          docker_image="${IMAGE_NAME}:${DEPLOY_IMAGE_SHA}"
          payload=$(jq -n \
            --arg applicationId "$DOKPLOY_APPLICATION_ID" \
            --arg dockerImage "$docker_image" \
            --arg username "$GHCR_DOKPLOY_USERNAME" \
            --arg password "$GHCR_DOKPLOY_TOKEN" \
            '{applicationId:$applicationId,dockerImage:$dockerImage,username:$username,password:$password,registryUrl:"ghcr.io"}')
          status_code=$(curl --silent --show-error \
            --write-out '%{http_code}' \
            --output /tmp/dokploy-provider-response.json \
            --request POST \
            "${DOKPLOY_API_URL%/}/api/application.saveDockerProvider" \
            --header 'accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "x-api-key: $DOKPLOY_API_TOKEN" \
            --data "$payload")

          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            echo "Dokploy image-source update failed with status $status_code"
            cat /tmp/dokploy-provider-response.json
            exit 1
          fi

          echo "Dokploy now targets $docker_image"

      - name: Trigger Dokploy image deployment
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.trigger_dokploy == 'true' }}
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN || secrets.DOKPLOY_AUTH_TOKEN }}
          DOKPLOY_API_URL: ${{ vars.DOKPLOY_API_URL || secrets.DOKPLOY_API_URL || vars.DOKPLOY_URL || secrets.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID || secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          status_code=$(curl --silent --show-error \
            --write-out '%{http_code}' \
            --output /tmp/dokploy-response.json \
            --request POST \
            "${DOKPLOY_API_URL%/}/api/application.deploy" \
            --header 'accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "x-api-key: $DOKPLOY_API_TOKEN" \
            --data "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}")

          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            echo "Dokploy deployment trigger failed with status $status_code"
            cat /tmp/dokploy-response.json
            exit 1
          fi

          cat /tmp/dokploy-response.json

      - name: Allow Dokploy deploy to start
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.trigger_dokploy == 'true' }}
        env:
          DOKPLOY_DEPLOY_SETTLE_SECONDS: ${{ vars.DOKPLOY_DEPLOY_SETTLE_SECONDS || '30' }}
        run: |
          case "$DOKPLOY_DEPLOY_SETTLE_SECONDS" in
            ''|*[!0-9]*)
              DOKPLOY_DEPLOY_SETTLE_SECONDS=120
              ;;
          esac

          if [ "$DOKPLOY_DEPLOY_SETTLE_SECONDS" -gt 0 ]; then
            echo "Waiting ${DOKPLOY_DEPLOY_SETTLE_SECONDS}s before health checks."
            sleep "$DOKPLOY_DEPLOY_SETTLE_SECONDS"
          fi

      - name: Validate optional Cloudflare configuration
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.purge_cloudflare == 'true' || inputs.warm_cloudflare == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "CLOUDFLARE_ZONE_ID is required when CLOUDFLARE_API_TOKEN is set"
            exit 1
          fi

          if [ -n "$CLOUDFLARE_ZONE_ID" ] && [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is required when CLOUDFLARE_ZONE_ID is set"
            exit 1
          fi

      - name: Wait for site health
        run: |
          health_url="${PRODUCTION_SITE_URL%/}/api/health"

          for attempt in $(seq 1 90); do
            status_code=$(curl --silent --show-error \
              --output /tmp/dokploy-health.json \
              --write-out '%{http_code}' \
              "$health_url" || true)

            if [ "$status_code" -eq 200 ]; then
              echo "Health endpoint responded on attempt $attempt"
              cat /tmp/dokploy-health.json
              if node -e 'const fs=require("fs"); const health=JSON.parse(fs.readFileSync("/tmp/dokploy-health.json","utf8")); if (!health.features || health.features.cacheTags !== true) { console.error("Health endpoint is live, but cacheTags feature flag is missing. Dokploy may still be serving an old build."); process.exit(1); } if (!health.features.cacheHeaderVersion || health.features.cacheHeaderVersion < 2) { console.error("Health endpoint is live, but cacheHeaderVersion is missing or old. Dokploy may still be serving an old build."); process.exit(1); } const sha=health.build&&health.build.sha; const expected=process.env.DEPLOY_IMAGE_SHA || ""; if (!sha || sha === "unknown") { console.error("Health build sha is unknown. Refusing to purge/warm Cloudflare because the workflow cannot prove Dokploy is serving the new build yet."); process.exit(1); } if (expected && !expected.startsWith(sha) && !sha.startsWith(expected)) { console.error("Health build sha " + sha + " does not match deployed image sha " + expected + "."); process.exit(1); }'; then
                echo "Health check passed on attempt $attempt"
                exit 0
              fi
            fi

            echo "Health check not ready yet (attempt $attempt, status $status_code)"
            sleep 10
          done

          echo "Timed out waiting for deployed site health"
          cat /tmp/dokploy-health.json || true
          exit 1

      - name: Verify deployed build before cache changes
        env:
          TEST_BASE_URL: ${{ env.PRODUCTION_SITE_URL }}
          POSTDEPLOY_BASE_URL: ${{ env.PRODUCTION_SITE_URL }}
          SITE_URL: ${{ env.PRODUCTION_SITE_URL }}
          EXPECTED_BUILD_SHA: ${{ env.DEPLOY_IMAGE_SHA }}
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        run: npm run verify:postdeploy

      - name: Purge Cloudflare cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.purge_cloudflare == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "Skipping Cloudflare purge because token or zone id is not configured"
            exit 0
          fi

          status_code=$(curl --silent --show-error \
            --write-out '%{http_code}' \
            --output /tmp/cloudflare-purge.json \
            --request POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"purge_everything":true}')

          if [ "$status_code" -ne 200 ]; then
            echo "Cloudflare purge failed with status $status_code"
            cat /tmp/cloudflare-purge.json
            exit 1
          fi

          cat /tmp/cloudflare-purge.json

      - name: Warm Cloudflare cache from sitemap
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.warm_cloudflare == 'true' }}
        env:
          CACHE_WARM_MODE: ${{ vars.CACHE_WARM_MODE }}
          CACHE_WARM_CONCURRENCY: ${{ vars.CACHE_WARM_CONCURRENCY }}
          CACHE_WARM_MAX_URLS: ${{ vars.CACHE_WARM_MAX_URLS }}
          CACHE_WARM_RECENT_PER_SITEMAP: ${{ vars.CACHE_WARM_RECENT_PER_SITEMAP }}
          CACHE_WARM_REQUEST_DELAY_MS: ${{ vars.CACHE_WARM_REQUEST_DELAY_MS }}
        run: |
          CACHE_WARM_SITE_URL="$PRODUCTION_SITE_URL" npm run cache:warm

      - name: Upload postdeploy reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postdeploy-quality-reports-${{ github.sha }}
          path: tmp/test-reports
          if-no-files-found: ignore
