name: Dokploy Production Deploy

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      trigger_dokploy:
        description: "Build/publish an image and deploy it through Dokploy"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      image_sha:
        description: "Existing GHCR commit SHA to deploy without rebuilding"
        required: false
        default: ""
        type: string
      site_url:
        description: "Production site URL"
        required: true
        default: "https://bloxodes.com"
        type: string
      purge_cloudflare:
        description: "Force a full Cloudflare purge"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
      runtime_code: ${{ steps.scope.outputs.runtime_code }}
      dataset: ${{ steps.scope.outputs.dataset }}
      smoke_paths: ${{ steps.scope.outputs.smoke_paths }}
      purge_tags: ${{ steps.scope.outputs.purge_tags }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        name: Classify production change
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DEPLOY: ${{ inputs.trigger_dokploy || 'true' }}
        run: |
          deploy=false
          runtime_code=false
          dataset=false
          : > /tmp/smoke-paths.txt
          : > /tmp/purge-tags.txt

          add_path() {
            if ! grep -Fxq "$1" /tmp/smoke-paths.txt; then
              printf '%s\n' "$1" >> /tmp/smoke-paths.txt
            fi
          }

          add_tag() {
            if ! grep -Fxq "$1" /tmp/purge-tags.txt; then
              printf '%s\n' "$1" >> /tmp/purge-tags.txt
            fi
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_DEPLOY" = "true" ]; then
              deploy=true
              runtime_code=true
              add_path "/"
              add_tag "site"
            fi
          else
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BEFORE_SHA="$(git rev-parse "${HEAD_SHA}^")"
            fi
            while IFS= read -r -d '' file; do
              case "$file" in
                data/*)
                  deploy=true
                  dataset=true
                  add_path "/wiki"
                  case "$file" in
                    */quiz.json) add_path "/quizzes" ;;
                  esac
                  ;;
                apps/web/src/data/*)
                  deploy=true
                  dataset=true
                  add_path "/"
                  ;;
                apps/web/public/*)
                  deploy=true
                  dataset=true
                  ;;
                apps/web/*|Dockerfile|package.json|package-lock.json)
                  deploy=true
                  runtime_code=true
                  case "$file" in
                    apps/web/src/app/sitemap.xml/*|apps/web/src/app/sitemaps/*|apps/web/src/app/feed.xml/*)
                      add_path "/sitemap.xml"
                      add_tag "sitemap"
                      ;;
                    *"/codes/"*) add_path "/codes"; add_tag "codes-index"; add_tag "codes" ;;
                    *"/wiki/"*|*game-collection*) add_path "/wiki"; add_tag "wiki-index"; add_tag "wiki"; add_tag "wiki-collection-index" ;;
                    *"/catalog/"*) add_path "/catalog"; add_tag "catalog-index"; add_tag "catalog" ;;
                    *"/tools/"*) add_path "/tools"; add_tag "tools-index"; add_tag "tools" ;;
                    *"/checklists/"*|*Checklist*) add_path "/checklists"; add_tag "checklists-index"; add_tag "checklists" ;;
                    *"/quizzes/"*|*Quiz*) add_path "/quizzes"; add_tag "quizzes-index"; add_tag "quizzes" ;;
                    *"/events/"*) add_path "/events"; add_tag "events-index"; add_tag "events" ;;
                    *"/articles/"*) add_path "/articles"; add_tag "articles-index"; add_tag "articles" ;;
                    *"/stats/"*|*/stats.ts) add_path "/stats"; add_tag "stats" ;;
                  esac
                  ;;
              esac
            done < <(git diff --name-only -z "$BEFORE_SHA" "$HEAD_SHA")
          fi

          if [ "$runtime_code" = "true" ] && [ "$(wc -l < /tmp/smoke-paths.txt)" -eq 0 ]; then
            add_path "/"
            add_tag "site"
          fi

          smoke_paths="$(head -n 5 /tmp/smoke-paths.txt | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          purge_tags="$(jq -R -s -c 'split("\n") | map(select(length > 0))' /tmp/purge-tags.txt)"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "runtime_code=$runtime_code" >> "$GITHUB_OUTPUT"
          echo "dataset=$dataset" >> "$GITHUB_OUTPUT"
          echo "smoke_paths=$smoke_paths" >> "$GITHUB_OUTPUT"
          echo "purge_tags=$purge_tags" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy runtime_code=$runtime_code dataset=$dataset smoke_paths=$smoke_paths purge_tags=$purge_tags"

  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    needs: classify
    if: ${{ needs.classify.outputs.deploy == 'true' }}
    concurrency:
      group: dokploy-production
      cancel-in-progress: false
    env:
      BLOXODES_ENV_PROFILE: process-only
      PRODUCTION_SITE_URL: ${{ inputs.site_url || vars.PRODUCTION_SITE_URL || 'https://bloxodes.com' }}
      IMAGE_NAME: ghcr.io/ravitejaknts/bloxodes-web
      DEPLOY_IMAGE_SHA: ${{ inputs.image_sha || github.sha }}
      SMOKE_PATHS: ${{ needs.classify.outputs.smoke_paths }}
      PURGE_TAGS: ${{ needs.classify.outputs.purge_tags }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: freshness
        name: Skip superseded production pushes
        shell: bash
        run: |
          fresh=true
          if [ "${{ github.event_name }}" = "push" ]; then
            current_sha="$(git ls-remote origin refs/heads/production | awk '{print $1}')"
            if [ "$current_sha" != "$GITHUB_SHA" ]; then
              git fetch --no-tags origin "$current_sha" --quiet
              newer_runtime=false
              while IFS= read -r -d '' file; do
                case "$file" in
                  data/*|apps/web/src/data/*|apps/web/public/*|apps/web/*|Dockerfile|package.json|package-lock.json)
                    newer_runtime=true
                    break
                    ;;
                esac
              done < <(git diff --name-only -z "$GITHUB_SHA" "$current_sha")
              if [ "$newer_runtime" = "true" ]; then
                echo "Skipping superseded SHA $GITHUB_SHA; newer runtime changes are present through $current_sha"
                fresh=false
              else
                echo "Continuing SHA $GITHUB_SHA; newer production commits are non-runtime through $current_sha"
              fi
            fi
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"

      - name: Validate production build environment
        if: ${{ steps.freshness.outputs.fresh == 'true' && (github.event_name != 'workflow_dispatch' || inputs.image_sha == '') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_MEDIA_PUBLIC_URL: https://media.bloxodes.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE SUPABASE_ANON_KEY SUPABASE_MEDIA_PUBLIC_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production build setting: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Create production build environment file
        if: ${{ steps.freshness.outputs.fresh == 'true' && (github.event_name != 'workflow_dispatch' || inputs.image_sha == '') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_MEDIA_PUBLIC_URL: https://media.bloxodes.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
          NEXT_PUBLIC_UMAMI_HOST_URL: ${{ vars.NEXT_PUBLIC_UMAMI_HOST_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || vars.PRODUCTION_SITE_URL || 'https://bloxodes.com' }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          umask 077
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_SERVICE_ROLE=%s\n' "$SUPABASE_SERVICE_ROLE"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'SUPABASE_MEDIA_PUBLIC_URL=%s\n' "$SUPABASE_MEDIA_PUBLIC_URL"
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            printf 'NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=%s\n' "$NEXT_PUBLIC_GOOGLE_ANALYTICS_ID"
            printf 'NEXT_PUBLIC_UMAMI_HOST_URL=%s\n' "$NEXT_PUBLIC_UMAMI_HOST_URL"
            printf 'NEXT_PUBLIC_UMAMI_WEBSITE_ID=%s\n' "$NEXT_PUBLIC_UMAMI_WEBSITE_ID"
            printf 'NEXT_PUBLIC_SITE_URL=%s\n' "$NEXT_PUBLIC_SITE_URL"
            printf 'SITE_URL=%s\n' "${SITE_URL:-$NEXT_PUBLIC_SITE_URL}"
          } > "$RUNNER_TEMP/bloxodes-production-build.env"

      - name: Free runner disk space for large asset image build
        if: ${{ steps.freshness.outputs.fresh == 'true' && (github.event_name != 'workflow_dispatch' || inputs.image_sha == '') }}
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up Docker Buildx
        if: ${{ steps.freshness.outputs.fresh == 'true' && (github.event_name != 'workflow_dispatch' || inputs.image_sha == '') }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ steps.freshness.outputs.fresh == 'true' && (github.event_name != 'workflow_dispatch' || inputs.image_sha == '') }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        if: ${{ steps.freshness.outputs.fresh == 'true' && (github.event_name != 'workflow_dispatch' || inputs.image_sha == '') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:production
          build-args: |
            BLOXODES_BUILD_SHA=${{ github.sha }}
          secret-files: |
            production_env=${{ runner.temp }}/bloxodes-production-build.env
          cache-from: type=gha,scope=bloxodes-production-web
          # The full intermediate cache took longer to upload than the app took
          # to build. Keep only the minimum reusable image cache.
          cache-to: type=gha,mode=min,scope=bloxodes-production-web

      - name: Validate Dokploy configuration
        if: ${{ steps.freshness.outputs.fresh == 'true' }}
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN || secrets.DOKPLOY_AUTH_TOKEN }}
          DOKPLOY_API_URL: ${{ vars.DOKPLOY_API_URL || secrets.DOKPLOY_API_URL || vars.DOKPLOY_URL || secrets.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID || secrets.DOKPLOY_APPLICATION_ID }}
          GHCR_DOKPLOY_USERNAME: ${{ vars.GHCR_DOKPLOY_USERNAME || github.repository_owner }}
          GHCR_DOKPLOY_TOKEN: ${{ secrets.GHCR_DOKPLOY_TOKEN }}
        run: |
          missing=0
          for name in DOKPLOY_API_TOKEN DOKPLOY_API_URL DOKPLOY_APPLICATION_ID GHCR_DOKPLOY_USERNAME GHCR_DOKPLOY_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required deployment setting: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Point Dokploy at the immutable production image
        if: ${{ steps.freshness.outputs.fresh == 'true' }}
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN || secrets.DOKPLOY_AUTH_TOKEN }}
          DOKPLOY_API_URL: ${{ vars.DOKPLOY_API_URL || secrets.DOKPLOY_API_URL || vars.DOKPLOY_URL || secrets.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID || secrets.DOKPLOY_APPLICATION_ID }}
          GHCR_DOKPLOY_USERNAME: ${{ vars.GHCR_DOKPLOY_USERNAME || github.repository_owner }}
          GHCR_DOKPLOY_TOKEN: ${{ secrets.GHCR_DOKPLOY_TOKEN }}
        run: |
          docker_image="${IMAGE_NAME}:${DEPLOY_IMAGE_SHA}"
          payload="$(jq -n \
            --arg applicationId "$DOKPLOY_APPLICATION_ID" \
            --arg dockerImage "$docker_image" \
            --arg username "$GHCR_DOKPLOY_USERNAME" \
            --arg password "$GHCR_DOKPLOY_TOKEN" \
            '{applicationId:$applicationId,dockerImage:$dockerImage,username:$username,password:$password,registryUrl:"ghcr.io"}')"
          status_code="$(curl --silent --show-error \
            --write-out '%{http_code}' \
            --output /tmp/dokploy-provider-response.json \
            --request POST \
            "${DOKPLOY_API_URL%/}/api/application.saveDockerProvider" \
            --header 'accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "x-api-key: $DOKPLOY_API_TOKEN" \
            --data "$payload")"
          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            cat /tmp/dokploy-provider-response.json
            exit 1
          fi

      - name: Trigger Dokploy image deployment
        if: ${{ steps.freshness.outputs.fresh == 'true' }}
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN || secrets.DOKPLOY_AUTH_TOKEN }}
          DOKPLOY_API_URL: ${{ vars.DOKPLOY_API_URL || secrets.DOKPLOY_API_URL || vars.DOKPLOY_URL || secrets.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID || secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          status_code="$(curl --silent --show-error \
            --write-out '%{http_code}' \
            --output /tmp/dokploy-response.json \
            --request POST \
            "${DOKPLOY_API_URL%/}/api/application.deploy" \
            --header 'accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "x-api-key: $DOKPLOY_API_TOKEN" \
            --data "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}")"
          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            cat /tmp/dokploy-response.json
            exit 1
          fi

      - name: Allow Dokploy deploy to start
        if: ${{ steps.freshness.outputs.fresh == 'true' }}
        env:
          DOKPLOY_DEPLOY_SETTLE_SECONDS: ${{ vars.DOKPLOY_DEPLOY_SETTLE_SECONDS || '30' }}
        run: |
          case "$DOKPLOY_DEPLOY_SETTLE_SECONDS" in
            ''|*[!0-9]*) DOKPLOY_DEPLOY_SETTLE_SECONDS=30 ;;
          esac
          sleep "$DOKPLOY_DEPLOY_SETTLE_SECONDS"

      - name: Wait for exact live SHA and healthy database
        if: ${{ steps.freshness.outputs.fresh == 'true' }}
        run: |
          health_url="${PRODUCTION_SITE_URL%/}/api/health?scope=deploy"
          for attempt in $(seq 1 60); do
            status_code="$(curl --silent --show-error \
              --output /tmp/dokploy-health.json \
              --write-out '%{http_code}' \
              "$health_url" || true)"
            if [ "$status_code" -eq 200 ] && node -e '
              const fs = require("fs");
              const health = JSON.parse(fs.readFileSync("/tmp/dokploy-health.json", "utf8"));
              const expected = process.env.DEPLOY_IMAGE_SHA || "";
              const sha = health.build && health.build.sha;
              if (health.ok !== true || !health.checks || health.checks.database?.ok !== true) process.exit(1);
              if (!sha || (!expected.startsWith(sha) && !sha.startsWith(expected))) process.exit(1);
            '; then
              cat /tmp/dokploy-health.json
              exit 0
            fi
            sleep 5
          done
          cat /tmp/dokploy-health.json || true
          exit 1

      - name: Validate selected Cloudflare configuration
        if: ${{ steps.freshness.outputs.fresh == 'true' && ((github.event_name == 'push' && needs.classify.outputs.runtime_code == 'true' && needs.classify.outputs.purge_tags != '[]') || (github.event_name == 'workflow_dispatch' && inputs.purge_cloudflare == 'true')) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ZONE_ID"

      - name: Purge targeted Cloudflare tags after runtime changes
        if: ${{ steps.freshness.outputs.fresh == 'true' && github.event_name == 'push' && needs.classify.outputs.runtime_code == 'true' && needs.classify.outputs.purge_tags != '[]' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          tags="$(printf '%s' "$PURGE_TAGS" | jq -c '.')"
          payload="$(jq -n --argjson tags "$tags" '{tags:$tags}')"
          status_code="$(curl --silent --show-error \
            --write-out '%{http_code}' \
            --output /tmp/cloudflare-targeted-purge.json \
            --request POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload")"
          if [ "$status_code" -ne 200 ]; then
            cat /tmp/cloudflare-targeted-purge.json
            exit 1
          fi

      - name: Run explicitly requested full Cloudflare purge
        if: ${{ steps.freshness.outputs.fresh == 'true' && github.event_name == 'workflow_dispatch' && inputs.purge_cloudflare == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          status_code="$(curl --silent --show-error \
            --write-out '%{http_code}' \
            --output /tmp/cloudflare-full-purge.json \
            --request POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"purge_everything":true}')"
          if [ "$status_code" -ne 200 ]; then
            cat /tmp/cloudflare-full-purge.json
            exit 1
          fi

      - name: Run tiny targeted live smoke
        if: ${{ steps.freshness.outputs.fresh == 'true' }}
        shell: bash
        run: |
          site="${PRODUCTION_SITE_URL%/}"
          sha_key="${DEPLOY_IMAGE_SHA:0:12}"
          mapfile -t paths < <(printf '%s' "$SMOKE_PATHS" | jq -r '.[]')

          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No HTML or sitemap smoke path was mapped for this deployment."
            exit 0
          fi

          for path in "${paths[@]}"; do
            separator="?"
            case "$path" in *\?*) separator="&" ;; esac
            url="${site}${path}${separator}__bloxodes_deploy=${sha_key}"
            headers="$(mktemp)"
            body="$(mktemp)"
            status_code="$(curl --silent --show-error --location \
              --max-time 20 \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "$url")"
            if [ "$status_code" -ne 200 ]; then
              echo "$path returned $status_code"
              exit 1
            fi
            if grep -Eqi 'internal server error|application error: a server-side exception|gateway time-out|bad gateway' "$body"; then
              echo "$path returned error HTML"
              exit 1
            fi
            if [ "$path" = "/sitemap.xml" ]; then
              grep -Eqi 'content-type: .*xml' "$headers"
              grep -q '<sitemapindex' "$body"
            else
              grep -Eqi 'content-type: .*html' "$headers"
              grep -qi '<title' "$body"
              grep -qi '<main' "$body"
            fi
            rm -f "$headers" "$body"
            echo "Passed $path"
          done
