name: Generate Event Guides

on:
  # schedule:
  #   - cron: "20 0,8,16 * * *"  # Disabled - manual runs only
  workflow_dispatch:

jobs:
  generate-event-guides:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      SUPABASE_MEDIA_BUCKET: ${{ secrets.SUPABASE_MEDIA_BUCKET }}
      SUPABASE_MEDIA_PUBLIC_URL: https://media.bloxodes.com
      SITE_URL: ${{ secrets.SITE_URL }}
      ARTICLE_AUTHOR_ID: ${{ secrets.ARTICLE_AUTHOR_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Queue event guides
        run: npm run queue:event-guides

      - name: Generate event guides
        run: npm run generate:events-articles
