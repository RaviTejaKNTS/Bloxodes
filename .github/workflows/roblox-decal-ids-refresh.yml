name: Roblox Decal IDs Refresh

on:
  workflow_dispatch:
  # Scheduled Roblox decal ID refresh runs on the VPS stats worker.
  # Keep this workflow manual-only as an emergency fallback.

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      ROBLOX_DECAL_COLLECT_MAX_ASSETS: '3000'
      ROBLOX_DECAL_TOOLBOX_MAX_PAGES: '4'
      ROBLOX_DECAL_TOOLBOX_PAGE_SIZE: '100'
      ROBLOX_DECAL_TOOLBOX_DELAY_MS: '125'
      ROBLOX_DECAL_TOOLBOX_MAX_RETRIES: '3'
    steps:
      - uses: actions/checkout@v6

      - name: Record start time
        run: |
          START_TIME=$(date -u '+%Y-%m-%d %H:%M:%SZ')
          echo "RUN_START_TIME=$START_TIME" >> $GITHUB_ENV
          echo "RUN_START_EPOCH=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect Roblox decal IDs
        run: npm run collect:decal-ids

      - name: Send automation summary
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.AUTOMATION_REPORT_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.AUTOMATION_REPORT_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }} - Discovery
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTOMATION_SUMMARY_TEXT: |
            Decal ID Details:
            • Discovery source: Roblox Creator Store/Toolbox decal search
            • Max assets this run: ${{ env.ROBLOX_DECAL_COLLECT_MAX_ASSETS }}
            • Max pages per query: ${{ env.ROBLOX_DECAL_TOOLBOX_MAX_PAGES }}
        run: |
          END_TIME=$(date -u '+%Y-%m-%d %H:%M:%SZ')
          END_EPOCH=$(date +%s)
          if [ -n "${RUN_START_EPOCH}" ]; then
            DURATION=$((END_EPOCH - RUN_START_EPOCH))
          else
            DURATION=0
          fi
          RUN_END_TIME="$END_TIME" \
          RUN_DURATION_SECONDS="$DURATION" \
          node scripts/automation/report-automation.mjs

  verify-and-rerank:
    runs-on: ubuntu-latest
    needs: discover
    timeout-minutes: 75
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      ROBLOX_DECAL_VERIFY_MAX_TOTAL: '5000'
      ROBLOX_DECAL_VERIFY_BATCH: '100'
      ROBLOX_DECAL_VERIFY_CONCURRENCY: '8'
      ROBLOX_DECAL_VERIFY_ORDER: 'asset_id'
      ROBLOX_DECAL_VERIFY_REFRESH_HOURS: '168'
      ROBLOX_DECAL_VERIFY_REQUEST_DELAY_MS: '80'
      ROBLOX_DECAL_VERIFY_BATCH_DELAY_MS: '300'
    steps:
      - uses: actions/checkout@v6

      - name: Record start time
        run: |
          START_TIME=$(date -u '+%Y-%m-%d %H:%M:%SZ')
          echo "RUN_START_TIME=$START_TIME" >> $GITHUB_ENV
          echo "RUN_START_EPOCH=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Roblox decal IDs
        run: npm run verify:decal-ids

      - name: Rerank decal IDs
        run: npm run rerank:decal-ids

      - name: Send automation summary
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.AUTOMATION_REPORT_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.AUTOMATION_REPORT_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }} - Verify and Rerank
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTOMATION_SUMMARY_TEXT: |
            Decal ID Details:
            • Verification source: Roblox asset details and thumbnail APIs
            • Max verified this run: ${{ env.ROBLOX_DECAL_VERIFY_MAX_TOTAL }}
            • Rerank: popularity, categories, curated score, curated rank
        run: |
          END_TIME=$(date -u '+%Y-%m-%d %H:%M:%SZ')
          END_EPOCH=$(date +%s)
          if [ -n "${RUN_START_EPOCH}" ]; then
            DURATION=$((END_EPOCH - RUN_START_EPOCH))
          else
            DURATION=0
          fi
          RUN_END_TIME="$END_TIME" \
          RUN_DURATION_SECONDS="$DURATION" \
          node scripts/automation/report-automation.mjs
