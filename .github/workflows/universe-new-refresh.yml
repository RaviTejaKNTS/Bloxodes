name: Universe New Refresh

on:
  workflow_dispatch: {}
  schedule:
    - cron: "7 */2 * * *"

concurrency:
  group: universe-new-refresh
  cancel-in-progress: false

jobs:
  new-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Light enrich NEW universes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ROBLOX_ENRICH_BATCH: 25
          ROBLOX_ENRICH_REQUEST_INTERVAL_MS: 2500
          ROBLOX_ENRICH_BATCH_DELAY_MS: 4000
          ROBLOX_ENRICH_RETRY_LIMIT: 6
        run: npm run enrich:universes:light -- --tier NEW --limit 1000 --batch 25

      - name: Refresh NEW stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          UNIVERSE_HOURLY_STATS_BATCH_SIZE: 50
          UNIVERSE_HOURLY_STATS_REQUEST_DELAY_MS: 1200
        run: npm run stats:refresh:new -- --limit 5000

      - name: Assign stats tiers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run stats:tier -- --tier NEW

      - name: Queue public stats revalidation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run enqueue:revalidation -- --source stats_new_workflow --event stats:stats --event stats:games
