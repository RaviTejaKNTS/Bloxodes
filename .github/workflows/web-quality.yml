name: Web Quality

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "scripts/quality/**"
      - "Dockerfile"
      - "eslint.config.mjs"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-quality.yml"
      - ".github/workflows/dokploy-production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:deterministic
      - name: Upload deterministic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-quality-reports
          path: tmp/test-reports
          if-no-files-found: ignore

  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: deterministic
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://bloxodes.com
      SITE_URL: https://bloxodes.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate public build settings
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
      - run: npm run build:web
