name: Targeted PR Checks

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "data/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "playwright.config.ts"
      - "scripts/quality/**"
      - "scripts/collections/audit-game-collection-datasets-v2.ts"
      - ".github/workflows/web-quality.yml"
      - ".github/workflows/dokploy-production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: targeted-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: scope
        name: Select targeted checks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base_sha="$BASE_SHA"
          if [ -z "$base_sha" ]; then
            base_sha="$(git rev-parse "${HEAD_SHA}^")"
          fi

          code=false
          dataset=false
          : > /tmp/bloxodes-lint-files.txt
          : > /tmp/bloxodes-test-inputs.txt

          while IFS= read -r -d '' file; do
            case "$file" in
              data/*|apps/web/src/data/*|apps/web/public/*)
                dataset=true
                ;;
              apps/web/*|package.json|package-lock.json|eslint.config.mjs|playwright.config.ts|scripts/quality/*|scripts/collections/audit-game-collection-datasets-v2.ts)
                code=true
                ;;
            esac

            if [ -f "$file" ]; then
              case "$file" in
                *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx)
                  printf '%s\0' "$file" >> /tmp/bloxodes-lint-files.txt
                  ;;
              esac
              case "$file" in
                apps/web/src/*.ts|apps/web/src/*.tsx|apps/web/src/**/*.ts|apps/web/src/**/*.tsx)
                  printf '%s\0' "$GITHUB_WORKSPACE/$file" >> /tmp/bloxodes-test-inputs.txt
                  ;;
              esac
            fi
          done < <(git diff --name-only --diff-filter=ACMR -z "$base_sha" "$HEAD_SHA")

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "dataset=$dataset" >> "$GITHUB_OUTPUT"
          echo "code=$code dataset=$dataset"

      - name: Check changed non-Markdown formatting
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude,glob)**/*.md'

      - uses: actions/setup-node@v6
        if: ${{ steps.scope.outputs.code == 'true' || steps.scope.outputs.dataset == 'true' }}
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: ${{ steps.scope.outputs.code == 'true' || steps.scope.outputs.dataset == 'true' }}
        run: npm ci --ignore-scripts

      - name: Lint changed source files
        if: ${{ steps.scope.outputs.code == 'true' }}
        shell: bash
        run: |
          mapfile -d '' files < /tmp/bloxodes-lint-files.txt
          if [ "${#files[@]}" -gt 0 ]; then
            npx eslint "${files[@]}" --max-warnings=0
          else
            echo "No changed JavaScript or TypeScript files require linting."
          fi

      - name: Run related unit tests
        if: ${{ steps.scope.outputs.code == 'true' }}
        shell: bash
        run: |
          mapfile -d '' inputs < /tmp/bloxodes-test-inputs.txt
          if [ "${#inputs[@]}" -gt 0 ]; then
            npx vitest related "${inputs[@]}" \
              --run \
              --config apps/web/vitest.config.ts \
              --passWithNoTests
          else
            echo "No changed web source files have related unit tests."
          fi

      - name: Validate bundled datasets and assets
        if: ${{ steps.scope.outputs.dataset == 'true' }}
        run: npm run audit:game-collection-datasets
