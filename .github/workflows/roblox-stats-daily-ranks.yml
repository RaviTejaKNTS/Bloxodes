name: Roblox Stats Daily Ranks

on:
  workflow_dispatch: {}
  schedule:
    - cron: "50 0 * * *"

concurrency:
  group: roblox-stats-daily-ranks
  cancel-in-progress: false

jobs:
  stats-daily-ranks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snapshot full daily ranks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          UNIVERSE_RANK_PAGE_SIZE: 1000
          UNIVERSE_RANK_UPSERT_CHUNK_SIZE: 5000
        run: npm run stats:rank -- --all --granularity daily --rank-set all --snapshot-scope all

      - name: Queue public stats revalidation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run enqueue:revalidation -- --source stats_daily_ranks_workflow --event stats:games
