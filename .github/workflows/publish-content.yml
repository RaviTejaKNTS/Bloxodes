name: Publish selected content
on:
  workflow_dispatch:
    inputs:
      batch:
        description: Exact merged content/releases/<batch>/batch.json
        required: false
        type: string
      bundle_hash:
        description: Exact SHA-256 of an approved private managed-development bundle
        required: false
        type: string
      approved_sha:
        description: Full current production SHA containing the reviewed batch
        required: true
        type: string
      apply:
        description: Publish the selected batch. False verifies only.
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: bloxodes-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      BLOXODES_ENV_PROFILE: process-only
      NODE_ENV: production
      BLOXODES_CONTENT_RELEASE: 'true'
      BLOXODES_APPROVED_SHA: ${{ inputs.approved_sha }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      SUPABASE_MEDIA_BUCKET: ${{ secrets.SUPABASE_MEDIA_BUCKET }}
      SUPABASE_MEDIA_PUBLIC_URL: https://media.bloxodes.com
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      WIKI_R2_ENDPOINT: ${{ secrets.WIKI_R2_ENDPOINT }}
      WIKI_R2_ACCESS_KEY_ID: ${{ secrets.WIKI_R2_ACCESS_KEY_ID }}
      WIKI_R2_SECRET_ACCESS_KEY: ${{ secrets.WIKI_R2_SECRET_ACCESS_KEY }}
      WIKI_R2_BUCKET: ${{ secrets.WIKI_R2_BUCKET }}
      ARTICLE_DEV_SUPABASE_URL: ${{ secrets.MANAGED_DEV_SUPABASE_URL }}
      ARTICLE_DEV_SUPABASE_SERVICE_ROLE: ${{ secrets.MANAGED_DEV_SUPABASE_SERVICE_ROLE }}
      BATCH: ${{ inputs.batch }}
      BUNDLE_HASH: ${{ inputs.bundle_hash }}
      APPLY: ${{ inputs.apply }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: production
          fetch-depth: 0
      - name: Require the reviewed current production SHA
        run: |
          test "$GITHUB_REF" = refs/heads/production
          test "$BLOXODES_APPROVED_SHA" = "$(git rev-parse HEAD)"
          test "$BLOXODES_APPROVED_SHA" = "$(git ls-remote origin refs/heads/production | cut -f1)"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/ci/__tests__/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Load the selected private bundle
        if: inputs.bundle_hash != ''
        run: |
          test -z "$BATCH"
          node --import tsx scripts/ci/download-content-bundle.ts
      - name: Require compatible live code
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://bloxodes.com/api/health?scope=deploy');
          const health = await response.json();
          if (!response.ok || health.ok !== true) throw new Error('Live application/database health failed.');
          const sha = health.build?.sha || health.buildSha || health.commit;
          if (!/^[0-9a-f]{40}$/.test(sha || '')) throw new Error('Live build SHA is missing.');
          const {execFileSync} = await import('node:child_process');
          execFileSync('git', ['merge-base', '--is-ancestor', sha, process.env.BLOXODES_APPROVED_SHA]);
          const changed = execFileSync('git', ['diff', '--name-only', sha, process.env.BLOXODES_APPROVED_SHA], {encoding:'utf8'}).trim().split('\n');
          if (changed.some(file => /^(apps\/web\/|data\/|Dockerfile$|package(-lock)?\.json$)/.test(file) && !file.endsWith('/AGENTS.md'))) throw new Error('Dependent web code has not deployed yet.');
          JS
      - name: Prove the batch, publish when selected, and verify public URLs
        run: |
          flags=()
          if [ "$APPLY" = true ]; then flags+=(--apply); fi
          node --import tsx scripts/ci/publish-content.ts --batch "$BATCH" "${flags[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-content-browser-${{ github.run_id }}
          path: tmp/test-reports/
          retention-days: 1
          if-no-files-found: ignore
