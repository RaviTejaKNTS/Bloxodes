name: Publish Wiki Collections 2026-08-09

on:
  push:
    branches:
      - production
    paths:
      - ".github/workflows/publish-wiki-collections-2026-08-09.yml"
      - "scripts/releases/wiki-collections-2026-08-09/**"

permissions:
  contents: read

concurrency:
  group: publish-wiki-collections-2026-08-09
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
    steps:
      - name: Check out production
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish and verify 50 wiki collections
        run: node scripts/releases/wiki-collections-2026-08-09/publish.mjs
