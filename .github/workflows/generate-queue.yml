name: Draft Code Page Generation

on:
  schedule:
    - cron: "20 0,12 * * *"
    - cron: "44 2,14 * * *"
    - cron: "8 5,17 * * *"
    - cron: "32 7,19 * * *"
    - cron: "56 9,21 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of draft games to process"
        required: false
        default: "10"

concurrency:
  group: draft-code-page-generation
  cancel-in-progress: false

jobs:
  generate-drafts:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    env:
      BLOXODES_ENV_PROFILE: process-only
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      GOOGLE_SEARCH_KEY: ${{ secrets.GOOGLE_SEARCH_KEY }}
      GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
      SUPABASE_MEDIA_BUCKET: ${{ secrets.SUPABASE_MEDIA_BUCKET }}
      SUPABASE_MEDIA_PUBLIC_URL: https://media.bloxodes.com
    steps:
      - name: Require Claude credentials
        run: |
          if [[ -z "${ANTHROPIC_API_KEY//[[:space:]]/}" && -z "${CLAUDE_CODE_OAUTH_TOKEN//[[:space:]]/}" ]]; then
            echo "::error::Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a repository secret."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.310

      - name: Generate draft code pages
        run: |
          LIMIT=${{ github.event.inputs.limit || 10 }}
          npm run generate -- --limit=$LIMIT
