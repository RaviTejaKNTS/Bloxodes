name: Draft Code Page Generation

on:
  schedule:
    - cron: "20 2,14 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of draft games to process"
        required: false
        default: "10"

concurrency:
  group: draft-code-page-generation
  cancel-in-progress: false

jobs:
  generate-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      GOOGLE_SEARCH_KEY: ${{ secrets.GOOGLE_SEARCH_KEY }}
      GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
      SUPABASE_MEDIA_BUCKET: ${{ secrets.SUPABASE_MEDIA_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Random human-like delay (0-20 min)
        run: |
          DELAY=$((RANDOM % 1200))
          echo "Sleeping for $DELAY seconds to vary run time..."
          sleep "$DELAY"

      - name: Install dependencies
        run: npm ci

      - name: Generate draft code pages
        run: |
          LIMIT=${{ github.event.inputs.limit || 10 }}
          npm run generate -- --limit=$LIMIT
