name: Universe Warm Refresh

on:
  workflow_dispatch: {}
  schedule:
    - cron: "32 */12 * * *"

concurrency:
  group: universe-warm-refresh
  cancel-in-progress: false

jobs:
  warm-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh WARM stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          UNIVERSE_HOURLY_STATS_BATCH_SIZE: 50
          UNIVERSE_HOURLY_STATS_REQUEST_DELAY_MS: 1200
        run: npm run stats:refresh:warm -- --limit 20000

      - name: Assign stats tiers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run stats:tier -- --tier WARM

      - name: Queue public stats revalidation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run enqueue:revalidation -- --source stats_warm_workflow --event stats:stats --event stats:games
