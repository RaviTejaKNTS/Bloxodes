name: Roblox Stats Hourly Retention

on:
  workflow_dispatch: {}
  schedule:
    - cron: "25 1 * * *"

concurrency:
  group: roblox-stats-hourly-retention
  cancel-in-progress: false

jobs:
  stats-hourly-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prune hourly stats history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          UNIVERSE_HOURLY_HISTORY_RETENTION_DAYS: 90
          UNIVERSE_HOURLY_HISTORY_PRUNE_BATCH_SIZE: 5000
          UNIVERSE_HOURLY_HISTORY_PRUNE_MAX_BATCHES: 200
        run: npm run stats:prune-hourly -- --days 90 --apply
