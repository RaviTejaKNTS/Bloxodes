name: Roblox Stats Daily Finalize

on:
  workflow_dispatch: {}
  schedule:
    - cron: "20 0 * * *"

concurrency:
  group: roblox-stats-daily-finalize
  cancel-in-progress: false

jobs:
  stats-daily-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Finalize yesterday daily stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run stats:rollup-daily -- --date yesterday --finalize

      - name: Audit stats workflow
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run stats:audit

      - name: Repair HOT media
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ROBLOX_ENRICH_BATCH: 25
          ROBLOX_ENRICH_REQUEST_INTERVAL_MS: 2500
          ROBLOX_ENRICH_BATCH_DELAY_MS: 4000
          ROBLOX_ENRICH_RETRY_LIMIT: 6
        run: npm run enrich:universes:light -- --tier HOT --limit 1000 --batch 25

      - name: Repair WARM media
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ROBLOX_ENRICH_BATCH: 25
          ROBLOX_ENRICH_REQUEST_INTERVAL_MS: 2500
          ROBLOX_ENRICH_BATCH_DELAY_MS: 4000
          ROBLOX_ENRICH_RETRY_LIMIT: 6
        run: npm run enrich:universes:light -- --tier WARM --limit 1000 --batch 25

      - name: Queue public stats revalidation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run enqueue:revalidation -- --source stats_daily_finalize_workflow --event stats:stats --event stats:games
