name: Roblox Stats Hourly

on:
  workflow_dispatch: {}
  schedule:
    - cron: "12 * * * *"

concurrency:
  group: roblox-stats-hourly
  cancel-in-progress: false

jobs:
  stats-hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update hourly stats and today rollup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          UNIVERSE_HOURLY_STATS_BATCH_SIZE: 50
          UNIVERSE_HOURLY_STATS_REQUEST_DELAY_MS: 1200
        run: npm run update:hourly-stats -- --quality-only --rollup-today --limit 10000

      - name: Snapshot stats ranks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run stats:rank -- --quality-only --limit 10000

      - name: Queue public stats revalidation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run enqueue:revalidation -- --source stats_hourly_workflow --event stats:stats --event stats:games
