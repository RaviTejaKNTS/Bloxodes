name: Universe Stats Refresh

on:
  workflow_dispatch: {}
  schedule:
    - cron: "42 */6 * * *"

concurrency:
  group: universe-stats-refresh
  cancel-in-progress: false

jobs:
  universe-stats-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          UNIVERSE_STATS_BATCH_SIZE: 50
          UNIVERSE_STATS_REQUEST_DELAY_MS: 1200
        run: npm run update:stats -- --limit 10000
