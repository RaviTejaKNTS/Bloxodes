name: Legacy Universe Stats Refresh

on:
  workflow_dispatch: {}

concurrency:
  group: legacy-universe-stats-refresh
  cancel-in-progress: false

jobs:
  legacy-universe-stats-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update stats manually
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          UNIVERSE_STATS_BATCH_SIZE: 50
          UNIVERSE_STATS_REQUEST_DELAY_MS: 1200
        run: npm run update:stats -- --limit 10000
