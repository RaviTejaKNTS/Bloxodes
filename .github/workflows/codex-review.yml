name: Selective Claude review
run-name: Claude review for PR ${{ github.event.pull_request.number || inputs.pull_request }}

on:
  pull_request:
    branches: [production]
    types: [opened, ready_for_review, reopened, synchronize, converted_to_draft, closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open production PR number to review when fixes are ready
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  scope:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      review: ${{ steps.scope.outputs.review }}
      number: ${{ steps.scope.outputs.number }}
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        id: scope
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        with:
          script: |
            const raw = process.env.PR_NUMBER;
            if (!/^[1-9][0-9]*$/.test(raw)) throw new Error('An exact PR number is required.');
            const number = Number(raw);
            const params = { ...context.repo, pull_number: number };
            const { data: pr } = await github.rest.pulls.get(params);
            const entries = await github.paginate(github.rest.pulls.listFiles, { ...params, per_page: 100 });
            if (entries.length !== pr.changed_files) throw new Error('The complete changed-file list is required.');
            const files = entries.flatMap(file => [file.filename, file.previous_filename].filter(Boolean));
            const { selectCodexReview } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/review-scope.mjs`);
            const scope = selectCodexReview({
              eventName: context.eventName, eventAction: context.payload.action,
              draft: pr.draft, state: pr.state, baseBranch: pr.base.ref,
              baseRepository: pr.base.repo.full_name, headRepository: pr.head.repo?.full_name,
              files
            });
            for (const sha of [pr.base.sha, pr.head.sha]) {
              if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Full commit SHAs are required.');
            }
            core.setOutput('review', String(scope.review));
            core.setOutput('number', String(number));
            core.setOutput('base', pr.base.sha);
            core.setOutput('head', pr.head.sha);
            await core.summary.addHeading('Selective review').addRaw(scope.reason).write();

  review:
    needs: scope
    if: needs.scope.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.claude.outputs.final-message }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.scope.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Claude Haiku 5.5 through the Claude Code CLI with no tools. The diff and
      # review guide are prepared here and piped in; the CLI runs in an empty
      # directory so PR-controlled settings and files can't reach the token.
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.310
      - name: Prepare the diff
        env:
          REVIEW_HEAD: ${{ needs.scope.outputs.head }}
          REVIEW_BASE: ${{ needs.scope.outputs.base }}
        run: |
          git diff --no-ext-diff --no-color "${REVIEW_BASE}...${REVIEW_HEAD}" > "$RUNNER_TEMP/review.diff"
          bytes=$(wc -c < "$RUNNER_TEMP/review.diff")
          if (( bytes > 400000 )); then
            head -c 400000 "$RUNNER_TEMP/review.diff" > "$RUNNER_TEMP/review.diff.cut"
            printf '\n\n[Diff truncated at 400,000 of %s bytes.]\n' "$bytes" >> "$RUNNER_TEMP/review.diff.cut"
            mv "$RUNNER_TEMP/review.diff.cut" "$RUNNER_TEMP/review.diff"
          fi
          cp .github/codex/review.md "$RUNNER_TEMP/review-guide.md"
          mkdir -p "$RUNNER_TEMP/claude-empty"
      - name: Review the selected code diff
        id: claude
        working-directory: ${{ runner.temp }}/claude-empty
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ needs.scope.outputs.number }}
          REVIEW_HEAD: ${{ needs.scope.outputs.head }}
          REVIEW_BASE: ${{ needs.scope.outputs.base }}
        run: |
          if [[ -z "${ANTHROPIC_API_KEY//[[:space:]]/}" && -z "${CLAUDE_CODE_OAUTH_TOKEN//[[:space:]]/}" ]]; then
            echo "::error::Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a repository secret."
            exit 1
          fi
          {
            printf 'Review PR #%s, base %s, head %s. The full diff is below; you have no tools.\n\n' "$PR_NUMBER" "$REVIEW_BASE" "$REVIEW_HEAD"
            cat "$RUNNER_TEMP/review-guide.md"
            printf '\nReply with only one JSON object, no prose and no code fence:\n'
            printf '{"summary": string, "findings": [{"priority": "P0"|"P1"|"P2", "title": string, "body": string, "path": string, "startLine": integer, "endLine": integer}]}\n'
            printf 'Use at most 8 findings. Paths are repository-relative as shown in the diff headers.\n\n<diff>\n'
            cat "$RUNNER_TEMP/review.diff"
            printf '\n</diff>\n'
          } > "$RUNNER_TEMP/review-prompt.txt"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/claude-empty" \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
            claude -p --model claude-haiku-5-5 --output-format json --max-turns 1 \
            --no-session-persistence --strict-mcp-config --mcp-config '{"mcpServers":{}}' \
            --permission-mode dontAsk --tools "" --settings '{"disableAllHooks":true}' \
            < "$RUNNER_TEMP/review-prompt.txt" > "$RUNNER_TEMP/claude-review.json"
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/claude-review.json", "utf8"));
            if (body.type !== "result" || body.subtype !== "success" || typeof body.result !== "string") {
              throw new Error(`Claude review did not finish (type=${body.type}, subtype=${body.subtype}).`);
            }
            const text = body.result.trim();
            const json = text.match(/^```(?:json)?\s*\n([\s\S]*?)\n```$/i)?.[1] ?? text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1);
            const result = JSON.parse(json);
            if (typeof result.summary !== "string" || !Array.isArray(result.findings)) throw new Error("Claude review JSON is missing summary or findings.");
            const delimiter = "REVIEW_" + require("crypto").randomUUID();
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `final-message<<${delimiter}\n${JSON.stringify(result)}\n${delimiter}\n`);
          '

  feedback:
    needs: [scope, review]
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.scope.outputs.number }}
          REVIEW_HEAD: ${{ needs.scope.outputs.head }}
          REVIEW_BASE: ${{ needs.scope.outputs.base }}
          REVIEW_RESULT: ${{ needs.review.outputs.result }}
          REVIEW_WORKSPACE: ${{ github.workspace }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const head = process.env.REVIEW_HEAD;
            const base = process.env.REVIEW_BASE;
            const params = { ...context.repo, pull_number: number };
            const { data: pr } = await github.rest.pulls.get(params);
            if (pr.state !== 'open' || pr.draft || pr.head.sha !== head || pr.base.sha !== base) {
              core.notice('The reviewed commit is no longer ready/current. No feedback posted.');
              return;
            }
            const result = JSON.parse(process.env.REVIEW_RESULT);
            if (typeof result.summary !== 'string' || !Array.isArray(result.findings) || result.findings.length > 8) {
              throw new Error('The reviewer did not return a bounded structured review.');
            }
            const entries = await github.paginate(github.rest.pulls.listFiles, { ...params, per_page: 100 });
            const changed = new Map(entries.map(file => [file.filename, file.status]));
            const findings = result.findings.map(finding => {
              const prefix = `${process.env.REVIEW_WORKSPACE}/`;
              const filename = typeof finding.path === 'string' && finding.path.startsWith(prefix) ? finding.path.slice(prefix.length) : finding.path;
              if (!['P0', 'P1', 'P2'].includes(finding.priority) || !changed.has(filename) ||
                  !Number.isInteger(finding.startLine) || !Number.isInteger(finding.endLine) ||
                  finding.startLine < 1 || finding.endLine < finding.startLine ||
                  typeof finding.title !== 'string' || typeof finding.body !== 'string') {
                throw new Error('A finding must cite a changed file with a valid line range.');
              }
              const path = filename.split('/').map(encodeURIComponent).join('/');
              const source = changed.get(filename) === 'removed' ? base : head;
              const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${source}/${path}#L${finding.startLine}`;
              return `- **${finding.priority}: ${finding.title}**\n\n  ${finding.body}\n\n  [${filename}:${finding.startLine}](${url})`;
            });
            const marker = '<!-- bloxodes-selective-codex-review -->';
            const body = `${marker}\nReviewed commit: \`${head}\`\n\n${result.summary}\n\n${findings.join('\n\n') || 'No actionable findings.'}\n\nCode review feedback. Required PR checks still apply. Request a fresh review after fixes through Actions > Selective Claude review.`;
            if (body.length > 60000) throw new Error('Review feedback exceeds the comment limit.');
            const issue = { ...context.repo, issue_number: number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...issue, per_page: 100 });
            const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...issue, body });
