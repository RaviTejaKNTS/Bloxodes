name: Universe Quality Score

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 */6 * * *"

concurrency:
  group: universe-quality-score
  cancel-in-progress: false

jobs:
  universe-quality-score:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Score universe quality
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ROBLOX_QUALITY_BATCH: 500
        run: npm run score:universes -- --limit 0
