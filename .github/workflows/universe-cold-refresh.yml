name: Universe Cold Refresh

on:
  workflow_dispatch: {}
  schedule:
    - cron: "47 */6 * * *"

concurrency:
  group: universe-cold-refresh
  cancel-in-progress: false

jobs:
  cold-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh rotating COLD stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          UNIVERSE_HOURLY_STATS_BATCH_SIZE: 50
          UNIVERSE_HOURLY_STATS_REQUEST_DELAY_MS: 1200
        run: npm run stats:refresh:cold -- --limit 10000

      - name: Assign stats tiers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run stats:tier -- --tier COLD

      - name: Queue public stats revalidation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run enqueue:revalidation -- --source stats_cold_workflow --event stats:stats --event stats:games
