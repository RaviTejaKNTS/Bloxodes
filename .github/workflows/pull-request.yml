name: Pull request checks

on:
  pull_request:
    branches: [production]
  workflow_dispatch:
    inputs:
      selected_roblox_bundle_hash:
        description: 'Optional immutable Roblox bundle SHA-256; verify already-staged managed development only'
        required: false
        default: ''
        type: string
      selected_franchise_bundle_hash:
        description: 'Optional approved immutable bundle SHA-256 for development-only franchise QA'
        required: false
        default: ''
        type: string
      selected_franchise_stage:
        description: 'Also stage approved development content (image bundles require all four R2 secrets on this ref)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.scope.outputs.checks }}
      migrations: ${{ steps.scope.outputs.migrations }}
      web: ${{ steps.scope.outputs.web }}
      extension: ${{ steps.scope.outputs.extension }}
      admin: ${{ steps.scope.outputs.admin }}
      mobile: ${{ steps.scope.outputs.mobile }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/change-scope.mjs
      - name: Validate changed GitHub workflow syntax
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -d '' workflows < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#workflows[@]}" -eq 0 ]; then exit 0; fi
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          # GitHub supports queue: max; actionlint 1.7.12 predates that field.
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= -ignore '^unexpected key "queue" for "concurrency" section\.' "${workflows[@]}"
      - name: Keep applied migrations immutable
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed="$(git diff --name-only --diff-filter=DMRT "$BASE_SHA" "$HEAD_SHA" -- supabase/migrations/)"
          if [ -n "$changed" ]; then
            echo "Existing migrations cannot be edited or deleted. Add a forward migration."
            exit 1
          fi
  managed-development:
    needs: scope
    if: needs.scope.outputs.checks == 'true'
    uses: ./.github/workflows/schema-release.yml
    with:
      production: false
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
  checks:
    needs: [scope, managed-development]
    if: ${{ always() && !cancelled() && needs.scope.outputs.checks == 'true' && (needs.scope.outputs.migrations == 'false' || needs.managed-development.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pr-checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      CI_TRANSACTION_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
      BLOXODES_ENV_PROFILE: process-only
      SUPABASE_URL: ${{ secrets.MANAGED_DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.MANAGED_DEV_SUPABASE_SERVICE_ROLE }}
      SUPABASE_ANON_KEY: ${{ secrets.MANAGED_DEV_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.MANAGED_DEV_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.MANAGED_DEV_SUPABASE_ANON_KEY }}
      SUPABASE_MEDIA_PUBLIC_URL: ${{ secrets.MANAGED_DEV_SUPABASE_URL }}
      SITE_URL: https://bloxodes.com
      NEXT_PUBLIC_SITE_URL: https://bloxodes.com
      TEST_CANONICAL_ORIGIN: https://bloxodes.com
      BLOXODES_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --project scripts/ci/tsconfig.json
      - run: npm run supabase:migrations:check
      - run: node --test scripts/ci/__tests__/*.test.mjs
      - run: npm run test:vps-boot-recovery
      - name: Verify selected content against managed development
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --import tsx scripts/ci/verify-content-batches.ts
      - run: npm run env:doctor -- --ci
      - run: npm run env:check
      - run: npm run test:article-queue && npm run test:wiki-runtime && npm run test:public-copy
      - if: needs.scope.outputs.extension == 'true'
        run: npm run typecheck:extension && npm run package:extension
      - if: needs.scope.outputs.admin == 'true'
        run: npm run typecheck:admin-extension
      - if: needs.scope.outputs.mobile == 'true'
        run: npm run typecheck:mobile
      - if: needs.scope.outputs.web == 'true'
        run: npm run lint && npm run test:unit:web
      - name: Build production routes with isolated catalog read fixtures
        if: needs.scope.outputs.web == 'true'
        run: |
          CATALOG_ROUTE_FIXTURES=1 NODE_OPTIONS="--import=$PWD/scripts/ci/catalog-fetch-fixture.mjs" npm run build:web
          npm run typecheck:web
      - if: needs.scope.outputs.web == 'true'
        run: npx playwright install --with-deps chromium
      - name: Verify cold catalog pagination, filters and failure behavior
        if: needs.scope.outputs.web == 'true'
        run: node scripts/ci/catalog-route-regression.mjs
      - if: needs.scope.outputs.web == 'true'
        run: npx playwright test apps/web/e2e/release-smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.web == 'true'
        with:
          name: browser-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/test-reports/
          retention-days: 1
          if-no-files-found: ignore
  required:
    name: Required PR checks
    needs: [scope, managed-development, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.checks == 'false' }}
          MANAGED: ${{ needs.managed-development.result }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          test "$SCOPE" = success
          if [ "$DOCS_ONLY" != true ]; then
            test "$MANAGED" = success
            test "$CHECKS" = success
          fi
  selected-franchise-development-qa:
    if: github.event_name == 'workflow_dispatch' && inputs.selected_franchise_bundle_hash != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: bloxodes-managed-content-qa
      queue: max
      cancel-in-progress: false
    env:
      BLOXODES_ENV_PROFILE: process-only
      BLOXODES_MANAGED_QA: 'true'
      BLOXODES_SELECTED_FRANCHISE_QA: 'true'
      SUPABASE_URL: ${{ secrets.MANAGED_DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.MANAGED_DEV_SUPABASE_SERVICE_ROLE }}
      SUPABASE_ANON_KEY: ${{ secrets.MANAGED_DEV_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.MANAGED_DEV_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.MANAGED_DEV_SUPABASE_ANON_KEY }}
      SUPABASE_MEDIA_PUBLIC_URL: ${{ secrets.MANAGED_DEV_SUPABASE_URL }}
      SUPABASE_MEDIA_BUCKET: media
      ARTICLE_DEV_SUPABASE_URL: ${{ secrets.MANAGED_DEV_SUPABASE_URL }}
      ARTICLE_DEV_SUPABASE_SERVICE_ROLE: ${{ secrets.MANAGED_DEV_SUPABASE_SERVICE_ROLE }}
      WIKI_R2_ENDPOINT: ${{ secrets.WIKI_R2_ENDPOINT }}
      WIKI_R2_ACCESS_KEY_ID: ${{ secrets.WIKI_R2_ACCESS_KEY_ID }}
      WIKI_R2_SECRET_ACCESS_KEY: ${{ secrets.WIKI_R2_SECRET_ACCESS_KEY }}
      WIKI_R2_BUCKET: ${{ secrets.WIKI_R2_BUCKET }}
      SITE_URL: https://bloxodes.com
      NEXT_PUBLIC_SITE_URL: https://bloxodes.com
      TEST_BASE_URL: http://bloxodes.test:3000
      BLOXODES_BUILD_SHA: ${{ github.sha }}
      BUNDLE_HASH: ${{ inputs.selected_franchise_bundle_hash }}
      BLOXODES_SELECTED_FRANCHISE_STAGE: ${{ inputs.selected_franchise_stage && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Require explicit development target before loading inputs
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$SUPABASE_URL" = https://bbtcaurrtyoukvjbxbbj.supabase.co
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npx tsc --project scripts/ci/tsconfig.json
      - name: Selected franchise contract and review regression tests
        run: node --test scripts/ci/__tests__/selected-franchise-qa.test.mjs
      - name: Download the exact approved private bundle
        run: node --import tsx scripts/ci/download-content-bundle.ts
      - name: Audit, dryplan and compare selected development rows (optionally stage)
        run: node --import tsx scripts/ci/selected-franchise-qa.ts prepare
      - name: Create runner-only signing secret
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import {randomBytes} from 'node:crypto';
          const secret = randomBytes(32).toString('hex');
          console.log(`::add-mask::${secret}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `AUTH_SESSION_SECRET=${secret}\n`);
          JS
      - run: node --import tsx scripts/ci/selected-franchise-qa.ts accounts
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - name: Selected desktop and mobile evidence on the GitHub preview
        env:
          RELEASE_SMOKE_BATCH: ${{ runner.temp }}/managed-smoke.json
          SELECTED_FRANCHISE_BROWSER: ${{ runner.temp }}/selected-franchise-browser.json
          SELECTED_FRANCHISE_AUTH: ${{ runner.temp }}/selected-franchise-auth.json
        run: npx playwright test apps/web/e2e/release-smoke.spec.ts apps/web/e2e/managed-franchise-content.spec.ts --timeout=120000
      - name: Repeat exact readback and finish the development-only report
        run: node --import tsx scripts/ci/selected-franchise-qa.ts complete
      - name: Remove only accounts and progress created by this run
        if: always()
        run: node --import tsx scripts/ci/selected-franchise-qa.ts cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-franchise-development-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/test-reports/
          retention-days: 1
          if-no-files-found: ignore

  selected-roblox-development-qa:
    if: github.event_name == 'workflow_dispatch' && inputs.selected_roblox_bundle_hash != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: bloxodes-managed-content-qa
      queue: max
      cancel-in-progress: false
    env:
      BLOXODES_ENV_PROFILE: process-only
      BLOXODES_MANAGED_QA: 'true'
      BLOXODES_SELECTED_ROBLOX_QA: 'true'
      SUPABASE_URL: ${{ secrets.MANAGED_DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.MANAGED_DEV_SUPABASE_SERVICE_ROLE }}
      SUPABASE_ANON_KEY: ${{ secrets.MANAGED_DEV_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.MANAGED_DEV_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.MANAGED_DEV_SUPABASE_ANON_KEY }}
      SUPABASE_MEDIA_PUBLIC_URL: ${{ secrets.MANAGED_DEV_SUPABASE_URL }}
      SUPABASE_MEDIA_BUCKET: media
      ARTICLE_DEV_SUPABASE_URL: ${{ secrets.MANAGED_DEV_SUPABASE_URL }}
      SITE_URL: https://bloxodes.com
      NEXT_PUBLIC_SITE_URL: https://bloxodes.com
      TEST_BASE_URL: http://bloxodes.test:3000
      BLOXODES_BUILD_SHA: ${{ github.sha }}
      BUNDLE_HASH: ${{ inputs.selected_roblox_bundle_hash }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Require explicit development target and immutable dispatch head
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$SUPABASE_URL" = https://bbtcaurrtyoukvjbxbbj.supabase.co
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npx tsc --project scripts/ci/tsconfig.json
      - name: Selected Roblox guards, normalized images, checklist facts, metadata and cleanup regressions
        run: node --test scripts/ci/__tests__/selected-roblox-qa.test.mjs
      - name: Download exact private managed-development bundle
        run: node --import tsx scripts/ci/selected-roblox-qa.ts download
      - name: Dryplan and compare already-staged Roblox content (no writes or uploads)
        run: node --import tsx scripts/ci/selected-roblox-qa.ts prepare
      - name: Create runner-only signing secret
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import {randomBytes} from 'node:crypto';
          const secret = randomBytes(32).toString('hex');
          console.log(`::add-mask::${secret}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `AUTH_SESSION_SECRET=${secret}\n`);
          JS
      - run: node --import tsx scripts/ci/selected-roblox-qa.ts accounts
      - run: npm run build:web
      - run: npm run typecheck:web
      - run: npx playwright install --with-deps chromium
      - name: Selected Roblox desktop and mobile evidence
        env:
          RELEASE_SMOKE_BATCH: ${{ runner.temp }}/managed-smoke.json
          SELECTED_ROBLOX_BROWSER: ${{ runner.temp }}/selected-roblox-browser.json
          SELECTED_ROBLOX_AUTH: ${{ runner.temp }}/selected-roblox-auth.json
        run: npx playwright test apps/web/e2e/release-smoke.spec.ts apps/web/e2e/managed-roblox-content.spec.ts --timeout=300000
      - name: Repeat exact dataset readback and complete managed-only report
        run: node --import tsx scripts/ci/selected-roblox-qa.ts complete
      - name: Always remove only this run's accounts, sessions and selected progress
        if: always()
        run: node --import tsx scripts/ci/selected-roblox-qa.ts cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-roblox-development-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/test-reports/
          retention-days: 1
          if-no-files-found: ignore
