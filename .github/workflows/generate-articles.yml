name: Generate Articles

on:
  # schedule:
  #   - cron: "5 0,6,12,18 * * *"  # Disabled - manual runs only
  workflow_dispatch:

jobs:
  generate-articles:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      BLOXODES_ENV_PROFILE: process-only
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      SUPABASE_MEDIA_BUCKET: ${{ secrets.SUPABASE_MEDIA_BUCKET }}
      SUPABASE_MEDIA_PUBLIC_URL: https://media.bloxodes.com
      SITE_URL: ${{ secrets.SITE_URL }}
      ARTICLE_AUTHOR_ID: ${{ secrets.ARTICLE_AUTHOR_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate article
        run: npm run generate:articles
