name: Daily Roblox Catalog Collection

on:
  workflow_dispatch:
  # Scheduled Roblox catalog discovery runs on the VPS stats worker. Keep this
  # workflow manual-only so GitHub runner IP limits do not throttle discovery.

concurrency:
  group: daily-catalog-items
  cancel-in-progress: false

jobs:
  collect-catalog-items:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      ROBLOX_CATALOG_LOG_LEVEL: info
      ROBLOX_CATALOG_ENQUEUE_REFRESH: "true"
      ROBLOX_CATALOG_SYNC_TAXONOMY: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect accessory items
        run: npm run collect:accessory-items

      - name: Collect body items
        run: npm run collect:body-items

      - name: Collect clothing items
        run: npm run collect:clothing-items

      - name: Collect avatar animation items
        run: npm run collect:avatar-animation-items
