name: Universe Light Enrichment

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 */3 * * *"

concurrency:
  group: universe-light-enrichment
  cancel-in-progress: false

jobs:
  universe-light-enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Light enrich universes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ROBLOX_ENRICH_BATCH: 25
          ROBLOX_ENRICH_REQUEST_INTERVAL_MS: 2500
          ROBLOX_ENRICH_BATCH_DELAY_MS: 4000
          ROBLOX_ENRICH_RETRY_LIMIT: 6
        run: npm run enrich:universes:light -- --limit 1000 --batch 25
