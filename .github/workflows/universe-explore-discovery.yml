name: Universe Explore Discovery

on:
  workflow_dispatch: {}
  schedule:
    - cron: "35 1 * * *"

concurrency:
  group: universe-explore-discovery
  cancel-in-progress: false

jobs:
  universe-explore-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect Explore universes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ROBLOX_EXPLORE_REQUEST_INTERVAL_MS: 1200
          ROBLOX_EXPLORE_PAGE_DELAY_MS: 1200
          ROBLOX_EXPLORE_SORT_DELAY_MS: 1500
          ROBLOX_EXPLORE_DEVICE_DELAY_MS: 6000
          ROBLOX_EXPLORE_RETRY_LIMIT: 6
        run: npm run collect:universes
