name: Discover Article Topics

on:
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "How far back to scan"
        required: false
        default: "96"

concurrency:
  group: article-topic-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Discover source leads
        run: npm run articles:discover -- --apply --allow-prod --max-age-hours "${{ inputs.max_age_hours }}"

      - name: Curate and queue approved topics
        run: npm run articles:curate -- --apply --allow-prod
