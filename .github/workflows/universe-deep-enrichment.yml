name: Universe Deep Enrichment

on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 2 * * *"

concurrency:
  group: universe-deep-enrichment
  cancel-in-progress: false

jobs:
  universe-deep-enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deep enrich quality universes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ENRICH_BATCH: 25
          ROBLOX_ENRICH_REQUEST_INTERVAL_MS: 3000
          ROBLOX_ENRICH_BATCH_DELAY_MS: 5000
          ROBLOX_ENRICH_RETRY_LIMIT: 6
          ROBLOX_ENRICH_CONCURRENCY: 2
          ROBLOX_OPEN_CLOUD_CONCURRENCY: 2
          ROBLOX_GROUP_CONCURRENCY: 2
        run: npm run enrich:universes:deep -- --quality-only --limit 500 --batch 25
