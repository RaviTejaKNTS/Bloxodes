name: Discover Beebom Code Pages

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      article_limit:
        description: "Number of Beebom tag-page articles to inspect"
        required: false
        default: "12"
      new_limit:
        description: "Maximum new draft code pages to insert"
        required: false
        default: "10"

concurrency:
  group: draft-code-page-generation
  cancel-in-progress: false

jobs:
  discover-and-generate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    env:
      BLOXODES_ENV_PROFILE: process-only
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      GOOGLE_SEARCH_KEY: ${{ secrets.GOOGLE_SEARCH_KEY }}
      GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
      SUPABASE_MEDIA_BUCKET: ${{ secrets.SUPABASE_MEDIA_BUCKET }}
      SUPABASE_MEDIA_PUBLIC_URL: https://media.bloxodes.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Discover and generate Beebom code pages
        run: |
          ARTICLE_LIMIT=${{ github.event.inputs.article_limit || 12 }}
          NEW_LIMIT=${{ github.event.inputs.new_limit || 10 }}
          npm run discover:beebom-codes -- --apply --article-limit=$ARTICLE_LIMIT --new-limit=$NEW_LIMIT
