name: Refresh Game Lists

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 1,7,13,19 * * *"

concurrency:
  group: refresh-game-lists
  cancel-in-progress: false

jobs:
  refresh-game-lists:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh game lists
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run lists:refresh
