name: Universe Discovery

on:
  workflow_dispatch: {}
  schedule:
    - cron: "7 */2 * * *"

concurrency:
  group: universe-discovery
  cancel-in-progress: false

jobs:
  universe-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Search discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ROBLOX_SEARCH_JOB_LIMIT: 80
          ROBLOX_SEARCH_MAX_PAGES: 2
          ROBLOX_SEARCH_REQUEST_INTERVAL_MS: 1500
          ROBLOX_SEARCH_CONTENT_TERM_LIMIT: 500
        run: npm run search:universes -- --seed --seed-content --limit 80 --max-pages 2

      - name: Creator and group expansion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ROBLOX_CREATOR_EXPAND_JOB_LIMIT: 50
          ROBLOX_CREATOR_EXPAND_MAX_PAGES: 2
          ROBLOX_CREATOR_EXPAND_SEED_LIMIT: 5000
          ROBLOX_CREATOR_EXPAND_REQUEST_INTERVAL_MS: 1500
        run: npm run expand:creators -- --seed --seed-limit 5000 --limit 50 --max-pages 2
