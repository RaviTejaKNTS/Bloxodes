name: Universe Playing Refresh

on:
  workflow_dispatch: {}
  schedule:
    - cron: "12 * * * *"

concurrency:
  group: universe-playing-refresh
  cancel-in-progress: false

jobs:
  universe-playing-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update playing counts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          UNIVERSE_PLAYING_BATCH_SIZE: 50
          UNIVERSE_PLAYING_REQUEST_DELAY_MS: 1000
        run: npm run update:playing -- --quality-only --limit 10000
